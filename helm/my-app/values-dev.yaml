replicaCount: 1

image:
  repository: 759210286431.dkr.ecr.ap-south-1.amazonaws.com/todo-backend
  tag: "4f619a8"
  pullPolicy: IfNotPresent

podLabels:
  tier: backend

service:
  type: ClusterIP
  port: 3001

env:
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_USER: root
  DB_PASSWORD: root
  DB_NAME: todo_db
  DB_NAME_TEST: todo_db_test
  PORT: "3001"

resources:
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 100m
    memory: 128Mi

# Development environment - faster probes for quicker feedback
livenessProbe:
  path: /api/live
  initialDelaySeconds: 15
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  path: /api/ready
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

startupProbe:
  enabled: true
  path: /api/health
  periodSeconds: 3
  failureThreshold: 20

autoscaling:
  enabled: false

volumes: []
volumeMounts: []

imagePullSecrets:
  - name: "ecr-secret"
