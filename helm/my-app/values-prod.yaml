replicaCount: 1

image:
  repository: 759210286431.dkr.ecr.ap-south-1.amazonaws.com/todo-backend
  tag: "4f619a8"
  pullPolicy: IfNotPresent

podLabels:
  tier: backend

service:
  type: ClusterIP
  port: 3001

env:
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_USER: root
  DB_PASSWORD: root
  DB_NAME: todo_db
  DB_NAME_TEST: todo_db_test
  PORT: "3001"

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

# Production environment - more conservative probe settings
livenessProbe:
  path: /api/live
  initialDelaySeconds: 60
  periodSeconds: 15
  timeoutSeconds: 10
  failureThreshold: 5

readinessProbe:
  path: /api/ready
  initialDelaySeconds: 20
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 5

startupProbe:
  enabled: true
  path: /api/health
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 30

autoscaling:
  enabled: false

volumes: []
volumeMounts: []

imagePullSecrets:
  - name: "ecr-secret"
